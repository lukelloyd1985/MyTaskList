<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:1024px;height:500px;overflow:hidden;}
  body{
    font-family:"Roboto","Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(135deg,#1E6B23 0%,#163F1A 100%);
    display:flex;
    align-items:center;
  }
  .card{
    width:320px;height:320px;margin-left:64px;flex:0 0 auto;
    background:#FFFFFF;border-radius:40px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.28);
  }
  .icon{width:260px;height:260px;border-radius:28px;overflow:hidden;}
  .text{margin-left:56px;color:#FFFFFF;}
  .title{font-size:76px;font-weight:700;letter-spacing:-1px;margin:0;}
  .tagline{font-size:29px;font-weight:400;opacity:0.88;max-width:520px;line-height:1.4;margin:18px 0 0;}
</style></head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" fill="#1B5E20"/>
      <polygon points="140,136 180,176 140,216 100,176" fill="#81C784"/>
      <rect x="180" y="158" width="232" height="36" rx="18" fill="#FFFFFF"/>
      <polygon points="140,216 180,256 140,296 100,256" fill="#81C784"/>
      <rect x="180" y="238" width="232" height="36" rx="18" fill="#FFFFFF"/>
      <polygon points="140,296 180,336 140,376 100,336" fill="#81C784"/>
      <rect x="180" y="318" width="150" height="36" rx="18" fill="#FFFFFF"/>
    </svg>
  </div>
  <div class="text">
    <p class="title">MyTasks</p>
    <p class="tagline">Shared task lists for your home, garden, and everything in between</p>
  </div>
</body></html>
