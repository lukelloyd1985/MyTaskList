<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;}
  body{font-family:"Roboto","Helvetica Neue",Arial,sans-serif;background:#FFFBFE;}
  .appbar{
    height:190px;box-sizing:border-box;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 32px 0 48px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
    position:relative;z-index:2;background:#FFFBFE;
  }
  .appbar .title{font-size:60px;font-weight:600;color:#1C1B1F;margin:0;}
  .appbar .profile{width:64px;height:64px;color:#1B5E20;}
  .list{padding:48px;display:flex;flex-direction:column;gap:36px;}
  .card{
    background:#F1F1EC;border-radius:36px;padding:48px;box-sizing:border-box;
  }
  .card .name{font-size:48px;font-weight:600;color:#1C1B1F;margin:0 0 24px;}
  .chip{
    display:inline-flex;align-items:center;
    background:#D8EDD5;border-radius:50px;padding:14px 28px;
  }
  .chip svg{width:34px;height:34px;margin-right:12px;color:#12351E;}
  .chip span{font-size:34px;font-weight:500;color:#12351E;}
  .members{font-size:34px;color:#49454F;margin:20px 0 0;}
  .fab{
    position:absolute;right:56px;bottom:110px;
    background:#1B5E20;color:#FFFFFF;border-radius:60px;
    display:flex;align-items:center;padding:34px 48px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  .fab svg{width:48px;height:48px;margin-right:20px;}
  .fab span{font-size:40px;font-weight:600;}
  .wrap{position:relative;height:1920px;}
</style></head>
<body>
<div class="wrap">
  <div class="appbar">
    <p class="title">My lists</p>
    <svg class="profile" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 8 1.34 8 4v2H4v-2c0-2.66 5.3-4 8-4zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
  </div>
  <div class="list">
    <div class="card">
      <p class="name">Garden</p>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3z"/></svg>
        <span>Private</span>
      </div>
    </div>
    <div class="card">
      <p class="name">House</p>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>Shared</span>
      </div>
      <p class="members">4 members</p>
    </div>
    <div class="card">
      <p class="name">Short term</p>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3z"/></svg>
        <span>Private</span>
      </div>
    </div>
  </div>
  <div class="fab">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
    <span>New list</span>
  </div>
</div>
</body></html>
