name: Android Build

on:
  # Run on demand from the Actions tab to get a debug APK for manual testing.
  workflow_dispatch:
  # Run automatically whenever a GitHub Release is published, attaching the
  # signed (if signing secrets are configured) release APK to it.
  release:
    types: [published]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # `if:` conditions can't reference the `secrets` context directly
      # ("Unrecognized named-value: 'secrets'") - only `env:` blocks can, so
      # the presence checks below go through these job-level booleans instead.
      HAS_KEYSTORE_SECRET: ${{ secrets.MYTASKS_KEYSTORE_BASE64 != '' }}
      HAS_DEBUG_KEYSTORE_SECRET: ${{ secrets.MYTASKS_DEBUG_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SERVICE_ACCOUNT_SECRET: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      # Baked into the release build's versionName (see app/build.gradle.kts).
      # Unused outside release-triggered steps, so harmless on other events.
      RELEASE_VERSION_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # compileSdk stays 35, but AGP 9.1.0 itself requires build-tools
      # >= 36.0.0 regardless of compileSdk.
      - name: Install Android SDK platform & build-tools
        run: sdkmanager "platforms;android-35" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # google-services.json is safe to commit (see README) and a working
      # placeholder already lives at app/google-services.json so the build
      # always succeeds out of the box. If a real Firebase project's file
      # has been added as the GOOGLE_SERVICES_JSON secret, it's swapped in
      # here so the resulting APK actually authenticates against it.
      - name: Use real google-services.json if configured
        if: ${{ env.HAS_GOOGLE_SERVICES_SECRET == 'true' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      # Without a signing secret, release builds fall back to the debug
      # keystore (see app/build.gradle.kts) so a testable APK is always
      # produced - this just upgrades it to a properly signed release build
      # when the secrets are present.
      - name: Decode release keystore
        if: ${{ env.HAS_KEYSTORE_SECRET == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.MYTASKS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "MYTASKS_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Without this, AGP's built-in debug signing auto-generates a brand
      # new, random debug.keystore on every run (runners are a fresh VM each
      # time), so the resulting APK's signing certificate is never the same
      # twice - Google Sign-In's account-reauth check can never trust an
      # unregistered, ever-changing certificate. Decoding a stable keystore
      # here (see README) makes every CI debug build carry the same
      # signature, so its SHA-1 can be registered in Firebase once.
      - name: Decode debug keystore
        if: ${{ github.event_name == 'workflow_dispatch' && env.HAS_DEBUG_KEYSTORE_SECRET == 'true' }}
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.MYTASKS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
          echo "MYTASKS_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          MYTASKS_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.MYTASKS_DEBUG_KEYSTORE_PASSWORD }}
          MYTASKS_DEBUG_KEY_ALIAS: ${{ secrets.MYTASKS_DEBUG_KEY_ALIAS }}
          MYTASKS_DEBUG_KEY_PASSWORD: ${{ secrets.MYTASKS_DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      # Builds both the sideloadable APK (for the GitHub Release / direct
      # install) and the App Bundle Google Play requires for a Play Store
      # upload, from the same signed, compiled sources.
      - name: Build release APK + AAB
        if: ${{ github.event_name == 'release' }}
        env:
          MYTASKS_KEYSTORE_PASSWORD: ${{ secrets.MYTASKS_KEYSTORE_PASSWORD }}
          MYTASKS_KEY_ALIAS: ${{ secrets.MYTASKS_KEY_ALIAS }}
          MYTASKS_KEY_PASSWORD: ${{ secrets.MYTASKS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload debug APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: mytasks-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK artifact
        if: ${{ github.event_name == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: mytasks-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload release AAB artifact
        if: ${{ github.event_name == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: mytasks-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Attach release APK + AAB to GitHub Release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      # Uploads the AAB straight to the Play Console "internal testing"
      # track - never production, see README "Publishing to Google Play".
      # Requires the app to already exist in Play Console and its very
      # first release to have been done manually there; see the README for
      # why and for the one-time service account setup this secret needs.
      - name: Publish to Google Play (internal track)
        if: ${{ github.event_name == 'release' && env.HAS_PLAY_SERVICE_ACCOUNT_SECRET == 'true' }}
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./gradlew publishReleaseBundle --stacktrace
