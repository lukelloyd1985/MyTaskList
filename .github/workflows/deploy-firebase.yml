name: Deploy Firebase (Firestore rules + Cloud Functions)

# Manual only (tap "Run workflow" in the Actions tab, from a phone browser
# or the GitHub app included - no local Firebase CLI or `firebase login`
# needed) rather than on every push, since this pushes real Firestore
# security rules and Cloud Functions straight to production. See README
# "Deploying Firestore rules and Cloud Functions" for the one-time
# service account setup this needs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SERVICE_ACCOUNT_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail early with a clear message if the secret isn't set
        if: ${{ env.HAS_FIREBASE_SERVICE_ACCOUNT_SECRET != 'true' }}
        run: |
          echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON repo secret is not set - see README 'Deploying Firestore rules and Cloud Functions' for the one-time setup."
          exit 1

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions

      # Firebase CLI picks this up automatically as Application Default
      # Credentials - no `firebase login` needed. This is a plain service
      # account key file, not Workload Identity Federation, so it isn't
      # affected by the WIF token-exchange timeout bug some firebase-tools
      # v15 releases have (https://github.com/firebase/firebase-tools/issues/10726).
      - name: Decode service account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # Reads the project ID straight out of the google-services.json
      # already committed to the repo, instead of needing yet another
      # secret/variable kept in sync with it.
      - name: Resolve Firebase project ID
        run: echo "FIREBASE_PROJECT_ID=$(jq -r '.project_info.project_id' app/google-services.json)" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Must run *before* the deploy below, not after. `firebase deploy
      # --only functions` does its own internal Artifact Registry
      # cleanup-policy check on every run (setupArtifactCleanupPolicies()
      # in firebase-tools' src/deploy/functions/release/index.ts) and,
      # in --non-interactive mode, *hard-fails the whole deploy* if no
      # policy exists yet for the region - it doesn't just warn. That
      # internal check only skips itself when a policy is already set
      # (artifacts.checkCleanupPolicy() finds nothing left to do), so
      # this standalone command has to set one first. --force here only
      # means "set this policy without an interactive prompt" - it does
      # NOT affect the deploy step below, which still runs without
      # --force so a removed function still isn't auto-deleted (see its
      # comment). --location must match the functions' own region
      # (europe-west2, see functions/src/index.ts).
      #
      # This does still no-op (exit 0, no error) if the europe-west2
      # Artifact Registry repository doesn't exist yet, which is only
      # true before that region's very first successful function
      # deploy - Cloud Functions creates the repository as part of that
      # first deploy, not before. If a *brand new* region is ever used
      # for the first time, this step will silently do nothing and the
      # deploy step below will then hard-fail with the cleanup-policy
      # error once - rerunning the workflow afterwards fixes it, since
      # by then the repository (and this step) both exist.
      - name: Set up Artifact Registry cleanup policy
        run: |
          firebase functions:artifacts:setpolicy \
            --location europe-west2 \
            --days 1 \
            --project "$FIREBASE_PROJECT_ID" \
            --force

      # Deliberately no --force: a function removed from source is left
      # alone rather than auto-deleted from the live project. In
      # --non-interactive mode (this workflow), firebase-tools makes
      # that safe rather than silent - without --force it *aborts the
      # deploy* the moment it finds a function to delete, printing the
      # exact `firebase functions:delete` command to run manually,
      # instead of deleting anything on its own. If that's ever needed,
      # run the printed command (or `firebase deploy --only functions
      # --force`) locally so it's a reviewed decision, not a side effect
      # of an unrelated rules/functions change.
      - name: Deploy Firestore rules, indexes, and Cloud Functions
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes,functions \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
