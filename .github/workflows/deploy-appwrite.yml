name: Deploy Appwrite (Tables + Functions)

# Manual only (tap "Run workflow" in the Actions tab, from a phone browser
# or the GitHub app included - no local Appwrite CLI or interactive login
# needed) rather than on every push, since this pushes real database
# tables and Functions straight to production. See README "CI deploy"
# for the one-time API key setup this needs.
#
# NOTE: `appwrite push <resource-type>` (e.g. `collection`/`table`/
# `function`) takes exactly one resource-type subcommand per invocation,
# each accepting a single optional positional argument that must
# literally be `all` - it does not accept multiple resource-type names in
# one call, and there's no separate `appwrite push databases` command
# ("unknown command 'databases' for 'appwrite push'"). The catch-all
# `appwrite push all --all --force` was tried as a way around both, but
# it also tries to push console-only resources (e.g. `settings`) that an
# API key can't authenticate for ("session not found ... API keys work
# for project commands ..., not console-only commands ..."). So this
# stays scoped to the resource types an API key CAN push (`table`,
# `function`) - the `mytasks` database itself needs creating once,
# manually, via the Console before the first run (README "Backend setup"
# step 3), since no confirmed API-key-compatible command creates it.
#
# appwrite.json's own schema keys are "tables"/"columns" (not the
# deprecated "collections"/"attributes" - confirmed necessary, not just a
# verb change, via "No tables found" against the old key names).
#
# WARNING - real, repeated destructive behavior: `appwrite push tables
# all --force`, run against a freshly-created `mytasks` database with
# zero existing tables, has TWICE deleted that database outright before
# creating anything - even with its ID correctly matching appwrite.json's
# ("mytasks | deleting | Database | mytasks | (deleted locally)", despite
# appwrite.json's own "databases" array clearly declaring it). This looks
# like `push tables` treats a database with no *existing* remote tables
# as orphaned and prunes it, without accounting for the tables it's about
# to create into it - a first-boot chicken-and-egg problem, not a config
# error. `--force` is why this happened with no confirmation prompt to
# catch it. Given two real deletions, `--force` is deliberately dropped
# from the tables push below - a required confirmation this CI can't
# answer should fail the step, not risk a third deletion. Do not re-add
# it until this is understood. Recommended workaround: create the three
# tables by hand in the Console once (matching appwrite.json's field
# names/types/columns/permissions exactly, same as the database's own
# bootstrap step), so `push tables` is only ever run against a database
# that already has tables in it, not an empty one.
#
# Function runtime: appwrite.json declared "node-24", syntactically valid
# per the CLI's own accepted-values list but rejected at push time with
# "Runtime "node-24" is not supported" - not every listed runtime is
# necessarily enabled for a given project/plan. Using "node-22" instead
# (still satisfies each function's own package.json ">=22" floor).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli

      # The project ID isn't sensitive (it only identifies the project -
      # no access without the API key below - and ships inside the built
      # APK regardless), so unlike APPWRITE_ENDPOINT/APPWRITE_API_KEY it's
      # not a GitHub secret: it's read straight from appwrite.json's own
      # "projectId" field, the same file `appwrite push` itself reads it
      # from (confirmed by a real run: authenticating with a correct
      # secret still failed pushing with "Project ... could not be found"
      # while a placeholder sat in this file - `appwrite push` doesn't use
      # the authenticated client session's project for that). This also
      # means the Android app (app/build.gradle.kts) and this workflow now
      # share one source of truth instead of each needing their own copy
      # of the same value - see README "Backend setup".
      - name: Authenticate with Appwrite
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$(jq -r '.projectId' appwrite/appwrite.json)" \
            --key "$APPWRITE_API_KEY"

      - name: Install function dependencies
        run: |
          for dir in appwrite/functions/*/; do
            (cd "$dir" && npm install)
          done

      # Reads appwrite/appwrite.json (the project's Appwrite CLI config,
      # listing the database, tables, and functions to push) directly -
      # see README "Backend setup" for how that file is produced. The
      # database itself must already exist, WITH its tables already
      # created at least once (see the top-of-file WARNING - pushing
      # tables into a table-less database has twice deleted the database
      # outright). No --force on the tables push, deliberately: a
      # confirmation prompt this CI can't answer should fail the step,
      # not silently proceed - see the top-of-file note before changing
      # this back.
      - name: Push tables and functions
        working-directory: appwrite
        run: |
          appwrite push tables all
          appwrite push function all --force
