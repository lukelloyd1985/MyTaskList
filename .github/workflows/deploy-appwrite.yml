name: Deploy Appwrite (Collections + Functions)

# Manual only (tap "Run workflow" in the Actions tab, from a phone browser
# or the GitHub app included - no local Appwrite CLI or interactive login
# needed) rather than on every push, since this pushes real database
# collections and Functions straight to production. See README "CI deploy"
# for the one-time API key setup this needs.
#
# NOTE: `appwrite push` takes exactly one resource-type subcommand per
# invocation, each accepting a single optional positional argument that
# must literally be `all` - it does not accept multiple resource types in
# one call. Confirmed from a real CI run's own CLI error: "`appwrite push
# collection` takes no arguments except `all`, and was given `functions`.
# Run `appwrite push collection all` to push every one". `database` isn't
# pushed separately below since appwrite.json's databases are implied by
# their collections - revisit if a real run shows otherwise.
#
# `collection` itself is deprecated in favor of `tables` (a real run
# logged: "appwrite push collection has been deprecated. Please consider
# using 'appwrite push tables' instead") - switched below. appwrite.json's
# own schema keys ("collections"/"attributes") are left as-is for now:
# Appwrite's Tables rename appears to also change attribute type names
# (e.g. generic "string" -> "varchar"/"text"/"mediumtext"/"longtext" by
# size), but this couldn't be confirmed against a primary source from
# this environment (appwrite.io itself is unreachable here, and the one
# concrete example file found via search 404'd). If `push tables` errors
# on the current schema, that error will say exactly what needs to change
# - trust it over any further guessing here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli

      - name: Authenticate with Appwrite
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$APPWRITE_PROJECT_ID" \
            --key "$APPWRITE_API_KEY"

      - name: Install function dependencies
        run: |
          for dir in appwrite/functions/*/; do
            (cd "$dir" && npm install)
          done

      # appwrite/appwrite.json is committed with a placeholder
      # "REPLACE_WITH_APPWRITE_PROJECT_ID" projectId (there's no real,
      # safe-to-commit value for it, unlike Firebase's google-services.json
      # - see README "Backend setup"). A real run authenticated successfully
      # via `appwrite client` above but then failed pushing with "Project
      # with the requested ID could not be found" while the placeholder was
      # still in place - likely `appwrite push` reads the project ID from
      # this file directly rather than the authenticated client session,
      # though that's inferred from the failure, not confirmed against CLI
      # source. Substitute the real ID in at deploy time either way, since
      # leaving a placeholder committed is wrong regardless of the exact
      # mechanism.
      - name: Set project ID in appwrite.json
        env:
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
        run: |
          jq --arg id "$APPWRITE_PROJECT_ID" '.projectId = $id' appwrite/appwrite.json > appwrite/appwrite.json.tmp
          mv appwrite/appwrite.json.tmp appwrite/appwrite.json

      # Reads appwrite/appwrite.json (the project's Appwrite CLI config,
      # listing the database, collections, and functions to push) directly
      # - see README "Backend setup" for how that file is produced.
      - name: Push collections and functions
        working-directory: appwrite
        run: |
          appwrite push tables all --force
          appwrite push function all --force
