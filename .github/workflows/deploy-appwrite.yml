name: Deploy Appwrite (Functions)

# Manual only (tap "Run workflow" in the Actions tab, from a phone browser
# or the GitHub app included - no local Appwrite CLI or interactive login
# needed) rather than on every push, since this pushes real database
# tables and Functions straight to production. See README "CI deploy"
# for the one-time API key setup this needs.
#
# NOTE: `appwrite push <resource-type>` (e.g. `collection`/`table`/
# `function`) takes exactly one resource-type subcommand per invocation,
# each accepting a single optional positional argument that must
# literally be `all` - it does not accept multiple resource-type names in
# one call, and there's no separate `appwrite push databases` command
# ("unknown command 'databases' for 'appwrite push'"). The catch-all
# `appwrite push all --all --force` was tried as a way around both, but
# it also tries to push console-only resources (e.g. `settings`) that an
# API key can't authenticate for ("session not found ... API keys work
# for project commands ..., not console-only commands ...").
#
# appwrite.json's own schema keys are "tables"/"columns" (not the
# deprecated "collections"/"attributes" - confirmed necessary, not just a
# verb change, via "No tables found" against the old key names).
#
# WARNING - `appwrite push tables all --force` has now planned to DELETE
# the `mytasks` database outright on FOUR separate real runs, including
# one where the database already held 3 correctly-created tables with a
# fully correct schema - which rules out every earlier theory (empty
# database, ID mismatch, the two genuine schema bugs already fixed along
# the way: "documentSecurity" -> "rowSecurity", and "visibility"/
# "priority" needing "type": "enum" instead of "type": "string" +
# "format": "enum"). This looks like `appwrite push tables` fundamentally
# not recognizing appwrite.json's top-level "databases" array as matching
# its own remote state for this project, independent of what's actually
# declared or already deployed - not a config mistake left to chase
# further.
#
# `appwrite push tables` is therefore DROPPED FROM THIS WORKFLOW ENTIRELY.
# `bootstrap-tables.mjs` (see the step below) is now the only path that
# touches the database/tables/columns/indexes, via the node-appwrite
# server SDK's TablesDB service directly - entirely bypassing `push`'s
# diff/delete logic. It's additive only: a table that already exists has
# its columns/indexes diffed against appwrite.json and only what's
# missing gets added - nothing is ever deleted or altered, so it's safe
# to run against real data. See bootstrap-tables.mjs's own header comment
# for the exact strategy and its limits (a drifted column is flagged, not
# auto-fixed).
#
# Function runtime: appwrite.json declared "node-24", syntactically valid
# per the CLI's own accepted-values list but rejected at push time with
# "Runtime "node-24" is not supported" - not every listed runtime is
# necessarily enabled for a given project/plan. Using "node-22" instead
# (still satisfies each function's own package.json ">=22" floor).
#
# Function push needs the API key scoped to "rules.read" too - a real run
# failed with "missing scopes (['rules.read'])". That scope is listed
# under Console's API key scope picker's "Proxy" category, not
# "Functions" - see README "Backend setup" step 7.
#
# Appwrite Cloud's free tier caps a project at 2 Functions - appwrite.json
# declares exactly 2 (`notifications`, `maintenance`), each dispatching
# internally between two triggers via the x-appwrite-trigger request
# header, specifically to fit that cap without needing a paid plan. See
# either function's src/main.ts and README "Backend setup" step 6.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli

      # The project ID isn't sensitive (it only identifies the project -
      # no access without the API key below - and ships inside the built
      # APK regardless), so unlike APPWRITE_ENDPOINT/APPWRITE_API_KEY it's
      # not a GitHub secret: it's read straight from appwrite.json's own
      # "projectId" field, the same file `appwrite push` itself reads it
      # from (confirmed by a real run: authenticating with a correct
      # secret still failed pushing with "Project ... could not be found"
      # while a placeholder sat in this file - `appwrite push` doesn't use
      # the authenticated client session's project for that). This also
      # means the Android app (app/build.gradle.kts) and this workflow now
      # share one source of truth instead of each needing their own copy
      # of the same value - see README "Backend setup".
      - name: Authenticate with Appwrite
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$(jq -r '.projectId' appwrite/appwrite.json)" \
            --key "$APPWRITE_API_KEY"

      - name: Install function dependencies
        run: |
          for dir in appwrite/functions/*/; do
            (cd "$dir" && npm install)
          done

      - name: Install bootstrap script dependencies
        working-directory: appwrite
        run: npm install

      # See the top-of-file WARNING and bootstrap-tables.mjs's own header
      # comment for why this exists and what it actually does: creates
      # missing tables and adds missing columns/indexes to existing ones,
      # bypassing `appwrite push tables`'s repeatedly-destructive
      # behavior entirely. Never deletes or alters anything - safe to run
      # against real data.
      - name: Bootstrap database and tables
        working-directory: appwrite
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: npm run bootstrap-tables

      # Only functions go through `appwrite push` - see the top-of-file
      # WARNING for why `appwrite push tables` is not run here at all.
      - name: Push functions
        working-directory: appwrite
        run: appwrite push function all --force
