name: Deploy Appwrite (Tables + Functions)

# Manual only (tap "Run workflow" in the Actions tab, from a phone browser
# or the GitHub app included - no local Appwrite CLI or interactive login
# needed) rather than on every push, since this pushes real database
# tables and Functions straight to production. See README "CI deploy"
# for the one-time API key setup this needs.
#
# NOTE: `appwrite push <resource-type>` (e.g. `collection`/`table`/
# `function`) takes exactly one resource-type subcommand per invocation,
# each accepting a single optional positional argument that must
# literally be `all` - it does not accept multiple resource-type names in
# one call, and there's no separate `appwrite push databases` command
# ("unknown command 'databases' for 'appwrite push'"). The catch-all
# `appwrite push all --all --force` was tried as a way around both, but
# it also tries to push console-only resources (e.g. `settings`) that an
# API key can't authenticate for ("session not found ... API keys work
# for project commands ..., not console-only commands ...").
#
# appwrite.json's own schema keys are "tables"/"columns" (not the
# deprecated "collections"/"attributes" - confirmed necessary, not just a
# verb change, via "No tables found" against the old key names).
#
# WARNING - `appwrite push tables all --force`, run against the `mytasks`
# database while it has zero existing tables, has on THREE separate real
# runs planned to DELETE the database outright before creating anything -
# even with its ID correctly matching appwrite.json, and even after
# fixing two genuine schema bugs (each table's "documentSecurity" ->
# "rowSecurity", and the "visibility"/"priority" columns' "type":
# "string" + "format": "enum" -> "type": "enum" - both confirmed against
# node-appwrite@28's real tables-db.d.ts, not guessed). The third run had
# --force removed specifically as a safety net, and it correctly refused
# instead of deleting ("needs an answer but there is no interactive
# terminal") - but it still PLANNED the identical deletion, which rules
# out the schema-bug theory as the actual cause. This looks like a
# genuine, reproducible `appwrite push tables` behavior against an empty
# database, independent of what's declared locally - not a config
# mistake to keep chasing.
#
# So bootstrapping the database and tables no longer goes through
# `appwrite push` at all: `bootstrap-tables.mjs` (see the step below)
# creates them directly via the node-appwrite server SDK's TablesDB
# service, reading the same appwrite.json, entirely bypassing `push`'s
# diff/delete logic. It's purely additive - create-if-missing, treating
# "already exists" (409) as success - so it's safe to re-run and never
# deletes anything. Once it has run once, the database always has at
# least one table in it before `appwrite push tables` ever runs against
# it, which is the state where this deletion behavior hasn't been
# observed - so `--force` is safe to keep on the ongoing sync push below
# (for later schema changes to already-existing tables). This reasoning
# hasn't been confirmed against a live run yet.
#
# Function runtime: appwrite.json declared "node-24", syntactically valid
# per the CLI's own accepted-values list but rejected at push time with
# "Runtime "node-24" is not supported" - not every listed runtime is
# necessarily enabled for a given project/plan. Using "node-22" instead
# (still satisfies each function's own package.json ">=22" floor).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli

      # The project ID isn't sensitive (it only identifies the project -
      # no access without the API key below - and ships inside the built
      # APK regardless), so unlike APPWRITE_ENDPOINT/APPWRITE_API_KEY it's
      # not a GitHub secret: it's read straight from appwrite.json's own
      # "projectId" field, the same file `appwrite push` itself reads it
      # from (confirmed by a real run: authenticating with a correct
      # secret still failed pushing with "Project ... could not be found"
      # while a placeholder sat in this file - `appwrite push` doesn't use
      # the authenticated client session's project for that). This also
      # means the Android app (app/build.gradle.kts) and this workflow now
      # share one source of truth instead of each needing their own copy
      # of the same value - see README "Backend setup".
      - name: Authenticate with Appwrite
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$(jq -r '.projectId' appwrite/appwrite.json)" \
            --key "$APPWRITE_API_KEY"

      - name: Install function dependencies
        run: |
          for dir in appwrite/functions/*/; do
            (cd "$dir" && npm install)
          done

      - name: Install bootstrap script dependencies
        working-directory: appwrite
        run: npm install

      # See the top-of-file WARNING for why this exists: creates the
      # database/tables/columns/indexes declared in appwrite.json
      # directly via the node-appwrite SDK, bypassing `appwrite push
      # tables`'s repeatedly-destructive behavior against an empty
      # database. Purely additive and idempotent - safe to run on every
      # deploy, not just the first.
      - name: Bootstrap database and tables
        working-directory: appwrite
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: npm run bootstrap-tables

      # Reads appwrite/appwrite.json (the project's Appwrite CLI config,
      # listing the database, tables, and functions to push) directly -
      # see README "Backend setup" for how that file is produced. --force
      # is back on the tables push here: by this point the bootstrap step
      # above guarantees the database already has tables in it, which is
      # the state where the deletion behavior in the top-of-file WARNING
      # hasn't been observed - this push now only needs to apply
      # incremental schema changes to already-existing tables.
      - name: Push tables and functions
        working-directory: appwrite
        run: |
          appwrite push tables all --force
          appwrite push function all --force
