[versions]
agp = "9.3.0"
kotlin = "2.4.10"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"
hilt = "2.60.1"
androidxHilt = "1.2.0"
firebaseBom = "33.7.0"
playPublisher = "4.1.1"
ksp = "2.3.10"
# Pinned to 25.2.0, not the newer 27.x releases, deliberately: 26.0.0's
# CHANGELOG entry ("Updated: raised compileSdk to 37") is what forces
# this whole project to compileSdk/targetSdk 37 - but Android API 37 is
# not actually published as an installable stable SDK platform yet
# (confirmed against developer.android.com/tools/releases/platforms,
# whose newest listed stable release is still API 36/Android 16) - so
# `sdkmanager "platforms;android-37"` in CI fails with "Failed to find
# package" no matter what cmdline-tools version is used to look for it.
# 25.2.0 is the release immediately before that bump. Verified
# byte-identical for every method this app actually calls (createPushTarget/
# updatePushTarget/deletePushTarget/createOAuth2Token - the four most
# recently added, so the most likely to have changed) against
# io.appwrite/services/Account.kt in github.com/appwrite/sdk-for-android at
# tag 25.2.0. 26.0.0/27.0.0's own CHANGELOG entries (minSdk 21->23,
# object-parameter typing Any->Map<String, Any?>) are both one-directional
# tightenings that only matter going forward, not downgrading back past
# them, so this project's own minSdk=31 and its typed Map call sites are
# unaffected either way.
appwrite = "25.2.0"
# Credential Manager + Google ID - see LoginScreen.kt. Pinned to the exact
# versions this app shipped to production with before the OAuth2 migration
# (verified-working, not guessed).
credentials = "1.3.0"
googleid = "1.1.1"
workManager = "2.10.0"
coil = "2.7.0"
coroutines = "1.9.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

appwrite = { group = "io.appwrite", name = "sdk-for-android", version.ref = "appwrite" }

credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No org.jetbrains.kotlin.android plugin: AGP 9's built-in Kotlin support
# compiles Kotlin sources directly, and is incompatible with applying that
# plugin (see gradle.properties and README "Notes & tradeoffs").
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
play-publisher = { id = "com.github.triplet.play", version.ref = "playPublisher" }
