org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9.0+ defaults to "built-in Kotlin" support, which is incompatible with
# applying org.jetbrains.kotlin.android the normal way (how this project's
# Kotlin/kapt/Compose compiler setup is built). This opts back into the
# pre-9.0 model so nothing else has to change for this AGP/Kotlin bump.
# It's a temporary bridge, not a permanent setting: AGP 10.0 removes the
# ability to opt out, so this project needs to migrate to built-in Kotlin
# (and kapt -> com.android.legacy-kapt) before then.
# See https://developer.android.com/build/migrate-to-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
