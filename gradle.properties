org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9.0+'s built-in Kotlin support (default, no opt-out here) compiles
# Kotlin sources directly - no org.jetbrains.kotlin.android plugin applied.
# Annotation processing (Hilt) runs via KSP, not kapt, since kapt is
# incompatible with built-in Kotlin.
